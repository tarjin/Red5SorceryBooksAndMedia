<!-- ============================================================
     RED5SORCERY NEWSLETTER SIGN-UP  —  reusable drop-in block
     Paste this whole block inside <main> on any page you like
     (e.g. index.html near the top, or books.html by the podcasts).
     It relies on the palette variables already defined in each
     page's :root (--panel, --cream, --ink, --gold, --muted), so
     it inherits the site's look automatically. Paste it ONCE per
     page. The About page already has this built in — don't add
     it there again.
     ============================================================ -->
<style>
  .newsletter{margin:clamp(2.6rem,5vw,3.6rem) 0;}
  .bd-card{background:var(--panel);border:1px solid #332c22;border-top:3px solid var(--blue-bright);padding:clamp(1.6rem,3.4vw,2.6rem) clamp(1.4rem,3vw,2.2rem);max-width:640px;margin:0 auto;text-align:center;}
  .bd-eyebrow{font-family:'Special Elite',monospace;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--blue-bright);}
  .bd-title{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(1.5rem,3.4vw,2.2rem);letter-spacing:.01em;margin:.55rem 0 .7rem;line-height:1;}
  .bd-lede{color:var(--muted);font-size:1rem;line-height:1.6;max-width:46ch;margin:0 auto 1.5rem;}
  .bd-name{color:var(--blue-bright);}
  .bd-form{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
  .bd-input{flex:1;min-width:220px;background:var(--ink);border:1px solid #4a4234;color:var(--cream);font-family:'Archivo',sans-serif;font-size:1rem;padding:.78rem .95rem;transition:border-color .25s;}
  .bd-input::placeholder{color:var(--muted);}
  .bd-input:focus{outline:none;border-color:var(--blue-bright);}
  .bd-btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--cream);color:var(--ink);border:1px solid var(--cream);font-family:'Special Elite',monospace;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;padding:.78rem 1.5rem;cursor:pointer;transition:background .25s,color .25s;}
  .bd-btn:hover{background:transparent;color:var(--cream);}
  .bd-btn .arr{transition:transform .3s;}
  .bd-btn:hover .arr{transform:translateX(5px);}
  .bd-powered{margin-top:1rem;font-family:'Special Elite',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;}
  .bd-powered a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .25s;}
  .bd-powered a:hover{border-color:var(--muted);}
  .bd-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>

<section class="newsletter" id="newsletter">
  <div class="bd-card">
    <span class="bd-eyebrow">The Newsletter</span>
    <h2 class="bd-title">Dispatches from the Press</h2>
    <p class="bd-lede"><strong class="bd-name">The Thursday Rotation</strong>, <strong class="bd-name">Council Notes</strong>, and first word on new work from Red5Sorcery. Sent when there&rsquo;s something worth sending.</p>
    <form class="bd-form embeddable-buttondown-form" action="https://buttondown.com/api/emails/embed-subscribe/red5sorcery" method="post">
      <label class="bd-vh" for="bd-email-2">Enter your email</label>
      <input class="bd-input" type="email" name="email" id="bd-email-2" placeholder="you@example.com" required />
      <button class="bd-btn" type="submit">Subscribe <span class="arr">&rarr;</span></button>
    </form>
    <p class="bd-powered"><a href="https://buttondown.com/refer/red5sorcery" target="_blank" rel="noopener">Powered by Buttondown</a></p>
  </div>
</section>
